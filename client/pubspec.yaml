name: flashcard_app
description: FSRS-based spaced repetition flashcard app MVP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  dio: ^5.8.0+1
  file_picker: ^10.1.9
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_math_fork: ^0.7.2
  go_router: ^14.8.1
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
flutter:
  uses-material-design: true
